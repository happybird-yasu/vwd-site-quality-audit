name: Diagnose unknown theme URLs (temporary, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List unknown-theme URLs from the live sitemap (one GET, read-only)
        run: python audit/_diagnose_unknown_themes.py
