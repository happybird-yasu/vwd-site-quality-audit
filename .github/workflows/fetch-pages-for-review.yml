name: Fetch pages for manual review (temporary, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch a fixed list of pages (read-only GET, same retry/delay as the audit)
        run: python audit/_fetch_pages_for_review.py
