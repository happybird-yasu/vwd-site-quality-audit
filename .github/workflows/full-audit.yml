name: Full content quality audit (app-navi.biz)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s audit -p "test_*.py" -v

      - name: Run full audit (read-only, every sitemap URL)
        run: python audit/run_audit.py --full

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: full-audit-report
          path: results/
          retention-days: 30
