name: Pilot content quality audit (app-navi.biz)

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Number of pages to sample (pilot default 26)"
        required: false
        default: "26"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s audit -p "test_*.py" -v

      - name: Run pilot audit (read-only)
        env:
          SAMPLE_SIZE: ${{ github.event.inputs.sample_size }}
        run: python audit/run_audit.py --sample-size "$SAMPLE_SIZE"

      - name: Run MAGI first-pass classification (A/B/C/D)
        run: python audit/classify_magi.py

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: results/
          retention-days: 30
