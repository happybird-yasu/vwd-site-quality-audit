name: Print population-theme review queue (temporary, no network access)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run ID to pull the full-audit-report artifact from"
        required: true

permissions:
  contents: read
  actions: read

jobs:
  print:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: full-audit-report
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
          path: results

      - name: Print population-theme rows from magi_review_queue.csv
        run: |
          CSV=$(find results -name magi_review_queue.csv | head -n1)
          echo "csv: $CSV"
          head -n1 "$CSV"
          awk -F',' 'NR==1 || $2=="population"' "$CSV"
